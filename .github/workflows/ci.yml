name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

# Actions pinned to full commit SHAs (tag in the comment; Dependabot updates both). pipeline/tests/test_workflows.py checks.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false  # repo_guard reads local history only; no token in .git/config while npm/pip code runs
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # npm ci before pytest: the built-points test needs node_modules/world-atlas
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest
      - run: python scripts/repo_guard.py --all
      # Full history every push: a new branch's first push has before = 0000..., so a before..sha range would skip it
      - name: Repo guard on pushed history
        if: github.event_name == 'push'
        run: python scripts/repo_guard.py --range ${{ github.sha }}
      - name: Repo guard on PR range
        if: github.event_name == 'pull_request'
        run: python scripts/repo_guard.py --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - run: npm run typecheck
      - run: npm run check:built
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
