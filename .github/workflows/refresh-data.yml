name: Refresh data
on:
  schedule:
    - cron: "0 6 3 * *"
  workflow_dispatch:

# Two jobs (README "Security"): `build` runs every third-party package (npm, pip, Playwright, the browser) with a read-only
# token and hands site/data on as an artifact; `publish` holds the write token and runs only git and the repo's stdlib
# scripts. Actions pinned to full commit SHAs (pipeline/tests/test_workflows.py).
permissions: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false  # third-party code runs below (npm ci, Playwright)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # npm ci before pytest: the built-points test needs node_modules/world-atlas
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest
      # A blocking regression vs the committed data (last year moved back, entity or group gone) fails this job;
      # no override here: accept it by a local run with --accept-regression (README "Refresh the data")
      - run: python -m pipeline.run
      # Bot pushes do not trigger ci.yml: test the refreshed site/data here (pytest: test_data_contract.py; site
      # gates and e2e in the browser) before it is committed
      - name: Tests on refreshed data
        run: python -m pytest
      - run: npm run typecheck
      - run: npm run check:built
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python scripts/repo_guard.py --all
      - name: Hand the refreshed data to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refreshed-data
          path: site/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Credentials persisted (checkout's default) so git authenticates from .git/config: the token is never in a
      # command line or the script text. Safe here only because no package code runs in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # tag_data.py finds the commit that introduced each data version (git log -S)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refreshed-data
          path: ${{ runner.temp }}/refreshed-data
      - name: Commit refreshed data
        env:
          DATA: ${{ runner.temp }}/refreshed-data
          REF_NAME: ${{ github.ref_name }}  # via env, never expanded into the script: a ref name may hold $( )
        run: |
          # the artifact may hold JSON files only (and folders): anything else is refused before it reaches site/data
          if [ -n "$(find "$DATA" -mindepth 1 ! -type d ! \( -type f -name '*.json' \) -print -quit)" ]; then
            echo "The artifact holds something other than JSON files"
            exit 1
          fi
          # *.json by name only so far: every file must also parse (stdlib, no package code; a truncated file must not
          # reach main and fail the Pages gates)
          python3 -I scripts/check_json.py "$DATA"
          rm -rf site/data
          cp -R "$DATA" site/data
          if [ -z "$(git status --porcelain site/data)" ]; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          # the build job ran --all on the old blobs; --staged scans the new pipeline output before it is committed
          python3 scripts/repo_guard.py --staged
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push origin "HEAD:$REF_NAME"
      # Every run on main, data changed or not: tags data-<version> on the commit that introduced it and pushes missing
      # tags (retries a missed push); never moves a tag (scripts/tag_data.py). Never on a branch: its commits may never
      # reach main (squash or rebase merge)
      - name: Tag data versions
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/tag_data.py --remote origin
